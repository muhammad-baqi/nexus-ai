# Local dev runs against the Supabase CLI stack (`supabase start`) — Postgres +
# Auth + Storage + Studio, matching what staging/prod actually run — not a bare
# Postgres container. Start it before `docker compose up`; the app service
# reaches it via host.docker.internal. See docs/deployment-model.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules   # named volume avoids host<->container node_modules conflicts
      - next_cache:/app/.next            # persists Next.js build cache across restarts
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Supabase local stack (`supabase start`) runs on the host, not in this
      # compose network — host.docker.internal reaches it from the container.
      # Service-role key stays out of compose; .env.local supplies it via env_file.
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
    env_file:
      - .env.local
    command: npm run dev

  # Dedicated container for running Playwright locally with the exact same
  # browser versions as CI.
  playwright:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - app
    environment:
      # Reaches the app service via its published host port, not the compose network's "app"
      # service-name DNS — Chromium hardcodes HSTS (forced-HTTPS) for the real .app gTLD, which
      # collides with a bare hostname literally named "app" and broke http://app:3000 navigation
      # with net::ERR_SSL_PROTOCOL_ERROR. A same-network "web" alias avoided that collision but
      # was intermittently unreachable (a Docker Desktop bridge-network-alias quirk); routing
      # through host.docker.internal instead — the same mechanism already reliably used to reach
      # local Supabase — sidesteps both problems.
      - BASE_URL=http://host.docker.internal:3000
      - MAILPIT_URL=http://host.docker.internal:54324
    entrypoint: ["npx", "playwright", "test"]
    profiles: ["test"]   # run with: docker compose --profile test run playwright

volumes:
  node_modules:
  next_cache:
